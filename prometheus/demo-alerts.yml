# ai-generated: 80% - Claude Code wrote the symptom rules from INCIDENT-SPEC.md and checked them against the lab4-rec-3 recording's baseline and fault
# prometheus/demo-alerts.yml - symptom alerts on the shop (INCIDENT-SPEC.md I-01, I-02, I-05).
#
# Symptoms, not causes: page (P1) on what a shopper feels at checkout - orders failing or orders slow - and send
# the per-service symptoms to chat (P2). Only SERVER spans count: the load generator's own client calls fail all the
# time on the healthy shop. The shop's metrics arrive once a minute, so every window is 5 minutes.
# All four rules are in one group, so that alerts that start together compete on severity (I-12), and every rule
# carries `cluster: shop`, the label the inhibit rule in alertmanager.yml compares with `equal`.
#
# Checked on the lab4-rec-3 recording: on its baseline (06:55-07:05Z) every expression returns nothing; in the fault
# checkout's error ratio reached 5.9 % and the frontend's p99 0.92 s.
groups:
  - name: shop-symptoms
    rules:
      - alert: ShopCheckoutErrors
        expr: |
          sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
          /
          sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_kind="SPAN_KIND_SERVER"}[5m]))
          > 0.02
        for: 1m
        labels:
          service: checkout
          severity: P1
          cluster: shop
        annotations:
          summary: "More than 2 % of orders fail at checkout over 5 minutes"

      - alert: ShopCheckoutLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="checkout", span_kind="SPAN_KIND_SERVER"}[5m])))
          > 3000
        for: 1m
        labels:
          service: checkout
          severity: P1
          cluster: shop
        annotations:
          summary: "The slowest 5 % of orders take more than 3 s at checkout"

      - alert: ShopFrontendLatency
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="frontend", span_kind="SPAN_KIND_SERVER"}[5m])))
          > 500
        for: 2m
        labels:
          service: frontend
          severity: P2
          cluster: shop
        annotations:
          summary: "The shop's pages: frontend p99 above 0.5 s over 5 minutes"

      - alert: ShopServiceErrors
        expr: |
          sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR", service_name!="load-generator"}[5m]))
          /
          sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", service_name!="load-generator"}[5m]))
          > 0.02
        for: 1m
        labels:
          service: shop
          severity: P2
          cluster: shop
        annotations:
          summary: "{{ $labels.service_name }} fails more than 2 % of the requests it answers"
